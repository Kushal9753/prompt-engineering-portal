<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prompt Engineering Learning Portal</title>
    <script>
      // GitHub Pages SPA Single-Page Apps redirect fix.
      // Source: https://github.com/rafgraph/spa-github-pages
      //
      // When GH Pages returns a 404 for a client-side route (e.g. /topic/zero-shot),
      // this file is served. We save the intended URL to sessionStorage and then
      // redirect back to the root (/) — where index.html's companion script will
      // restore the URL via history.replaceState before React hydrates.
      var segmentCount = 1; // 1 = keep the repo name segment (e.g. /prompt-engineering-portal)
      var l = window.location;
      sessionStorage.redirect = l.href;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=1'
      );
    </script>
  </head>
  <body></body>
</html>
